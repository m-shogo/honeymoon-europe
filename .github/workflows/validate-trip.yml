name: Validate Honeymoon Itinerary
on:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/validate-trip.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/validate-trip.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-trip.mjs
